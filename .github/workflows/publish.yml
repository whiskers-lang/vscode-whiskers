name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: vscode-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sign in with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Read package version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build VSIX
        run: npx --no-install vsce package --out whiskers.vsix --no-dependencies --skip-license

      - uses: actions/upload-artifact@v4
        with:
          name: whiskers-${{ steps.package.outputs.version }}
          path: whiskers.vsix
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        run: npx --no-install vsce publish --packagePath whiskers.vsix --azure-credential
