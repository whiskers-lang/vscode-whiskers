name: PR Gate

on:
  pull_request:
    branches: [main]
    paths:
      - src/**

permissions:
  contents: read

jobs:
  build-test-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Validate version
        env:
          VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: npm run check:version
