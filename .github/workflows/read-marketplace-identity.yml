name: Read Marketplace Identity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  read-identity:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - name: Sign in with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Read Azure DevOps profile ID
        id: profile
        run: |
          profile_id=$(az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id \
            --output tsv)
          echo "Azure DevOps profile ID: $profile_id"
          echo "## Marketplace identity" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$profile_id\`" >> "$GITHUB_STEP_SUMMARY"
